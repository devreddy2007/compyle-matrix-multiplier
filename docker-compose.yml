version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: code_generator_db
    environment:
      POSTGRES_USER: codegenuser
      POSTGRES_PASSWORD: codegenpass123
      POSTGRES_DB: code_generator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codegenuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_generator_backend
    environment:
      DATABASE_URL: postgresql://codegenuser:codegenpass123@postgres:5432/code_generator
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: code_generator_frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
